name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Java + Windows native
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify sources and build Java payload
        shell: pwsh
        run: .\gradlew.bat clean build verifyInjectionPayload --stacktrace

      - name: Build Windows x64 injection bundle
        shell: pwsh
        run: .\gradlew.bat prepareInjectionBundle -PtargetRelease=8 "-PnativeJavaHome=$env:JAVA_HOME" --stacktrace

      - name: Run native component tests
        shell: pwsh
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Upload Java injection payload
        uses: actions/upload-artifact@v4
        with:
          name: java-injection-payload
          path: build/libs/*-injection.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows x64 injection bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-injection-bundle
          path: build/injection/
          if-no-files-found: error
          retention-days: 14
